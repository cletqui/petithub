name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "19 4 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  scan:
    permissions:
      contents: read
      security-events: write
    uses: cletqui/security-workflows/.github/workflows/scan.yml@1f98d52cc27ae99aebfce3173c601f11465f4808 # v2.0.0
    with:
      product: petithub
      dojo_url: ${{ vars.DOJO_URL }}
      osv_lockfile: bun.lock
      codeql_language: javascript-typescript
      codeql_upload: never
    secrets:
      DOJO_TOKEN: ${{ secrets.DOJO_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
